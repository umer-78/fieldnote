[project]
name = "fieldnote"
version = "0.1.0"
description = "Answers read off page images, retrieved through a per-modality index, cited with the crop that holds them"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=2", "scikit-learn==1.9.1", "pillow>=10", "rapidocr-onnxruntime==1.4.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fieldnote"]
